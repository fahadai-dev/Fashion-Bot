<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rina Fashion Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
  
  .chat-container { width: 420px; height: 680px; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; }
  
  .chat-header { background: #16a34a; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .header-info h3 { color: white; font-size: 16px; }
  .header-info p { color: #bbf7d0; font-size: 12px; }
  .online-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 4px; }

  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #f0f2f5; }
  
  .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
  .message.bot { background: white; border-radius: 2px 12px 12px 12px; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #1f2937; }
  .message.user { background: #dcf8c6; border-radius: 12px 12px 2px 12px; align-self: flex-end; color: #1f2937; }
  .message.typing { background: white; align-self: flex-start; padding: 14px; }
  .typing-dots span { display: inline-block; width: 8px; height: 8px; background: #9ca3af; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

  .chat-input { padding: 12px 16px; background: white; display: flex; gap: 10px; align-items: center; border-top: 1px solid #e5e7eb; }
  .chat-input input { flex: 1; padding: 10px 16px; border: 1px solid #e5e7eb; border-radius: 24px; font-size: 14px; outline: none; font-family: inherit; }
  .chat-input input:focus { border-color: #16a34a; }
  .send-btn { width: 42px; height: 42px; background: #16a34a; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send-btn svg { width: 20px; height: 20px; fill: white; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">👗</div>
    <div class="header-info">
      <h3>Rina Fashion</h3>
      <p><span class="online-dot"></span>সবসময় অনলাইন</p>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">
      আসসালামু আলাইকুম! 👋 আমি রিনা, Rina Fashion এর AI assistant। আপনাকে কীভাবে সাহায্য করতে পারি?
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="মেসেজ লিখুন..." />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('userInput');

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.innerText = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message typing';
  div.id = 'typing';
  div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;
  
  addMessage(msg, 'user');
  input.value = '';
  showTyping();

  try {
    const res = await fetch('http://localhost:3000/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, phone: '01711111111' })
    });
    const data = await res.json();
    removeTyping();
    addMessage(data.reply || 'কোনো reply আসেনি', 'bot');
  } catch (err) {
    removeTyping();
    addMessage('❌ Server connect হচ্ছে না', 'bot');
  }
}

input.addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
